[package]
name = "rnaseq-enrichment-flow"
kind = "flow"
version = "0.1.0"
release = 1
license = "Apache-2.0"
main = "src/main.taf"

[repository]
url = "https://github.com/taffish/rnaseq-enrichment-flow"

[command]
name = "taf-rnaseq-enrichment-flow"

[runtime]
pipe = false
command_mode = false

[meta]
domain = "bio"
categories = ["rna-seq", "enrichment", "gene-set-analysis", "workflow", "transcriptomics"]
keywords = ["rnaseq-enrichment-flow", "rna-seq", "enrichment", "ORA", "GSEA", "GMT", "gene-sets", "fgsea", "transcriptomics"]
description = "TAFFISH RNA-seq enrichment flow for GMT-based ORA/GSEA from DE gene lists, ranked genes, background genes, plots, reports, and provenance."

[upstream]
name = "rnaseq-enrichment-flow"
type = "taffish-flow"
homepage = "https://github.com/taffish/rnaseq-enrichment-flow"
version = "0.1.0"
license = "Apache-2.0"
description = "TAFFISH-maintained RNA-seq enrichment interpretation flow composed from the version-pinned enrichment-r TAFFISH tool app."

[dependencies]
taf-enrichment-r = "0.1.0-r1"
